services:
  db:
    image: postgres:17
    container_name: shuttlestack-db
    environment:
      POSTGRES_USER: shuttlestack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shuttlestack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuttlestack -d shuttlestack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: